name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate scholarship data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The validator has no dependencies, so data-only pull requests --
      # the common case -- get their answer without an npm install.
      - run: node scripts/validate-data.mjs

  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
