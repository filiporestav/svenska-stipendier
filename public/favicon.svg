<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Svenska stipendier">
  <!--
    The masthead mark: the filled square that stands in front of the name.
    Ink tile, paper square, and the two swap under a dark browser theme so the
    icon keeps its contrast either way.
  -->
  <style>
    .tile { fill: #14161a; }
    .mark { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #eff1f4; }
      .mark { fill: #10121a; }
    }
  </style>
  <rect class="tile" width="64" height="64"/>
  <rect class="mark" x="20" y="20" width="24" height="24"/>
</svg>
